<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>저승굿 화풍 시안 s5 · 픽셀 아트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@700;800&family=Noto+Sans+KR:wght@700;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0b0b1a; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="out" width="1280" height="800"></canvas>
<script>
// ─────────────────────────────────────────────────────────────
// s5 픽셀 아트 — 320×200 원본, 32색 팔레트, 최근접 ×4 확대.
// 글자는 640×400 격자(×2)에 Google Fonts 한글 글꼴을 계단(문턱값)으로 찍는다.
// ─────────────────────────────────────────────────────────────
const PAL = {
  k: '#0b0b1a', h: '#15142e', x: '#1f1f45', u: '#2b2d5c', i: '#3a3f78', j: '#4b558f', e: '#6672a8', p: '#8f9ac4',
  W: '#c7cfe6', w: '#f4f1e0', m: '#fff1a8', Y: '#e8c86a', T: '#b8872e', N: '#6e4a26', n: '#9a6838', d: '#4a2a1e',
  t: '#c89a62', v: '#e2c48e', s: '#f2d0b0', S: '#c88a70', R: '#8a2a2e', r: '#c83a3a', o: '#ff6a50', y: '#ffd040',
  B: '#1e3a7a', b: '#2f62c0', l: '#5fa0e8', c: '#8ef0ff', G: '#2a6a58', g: '#3f9a6e', A: '#5c6278', a: '#8e94aa',
};
const LW = 320, LH = 200;
const low = document.createElement('canvas'); low.width = LW; low.height = LH;
const L = low.getContext('2d');
const BAY = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bay = (x, y) => (BAY[y & 3][x & 3] + 0.5) / 16;

function P(x, y, c) { if (c === '.' || !PAL[c]) return; L.fillStyle = PAL[c]; L.fillRect(x | 0, y | 0, 1, 1); }
function R(x, y, w, h, c) { L.fillStyle = PAL[c]; L.fillRect(x | 0, y | 0, w | 0, h | 0); }
function dith(x, y, w, h, a, b, lv) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) P(i, j, bay(i, j) < lv ? b : a); }
function dots(x, y, w, h, c, lv) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (bay(i, j) < lv) P(i, j, c); }
function ell(cx, cy, rx, ry, c, test) { for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) { const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry, q = dx * dx + dy * dy; if (q <= 1 && (!test || test(x, y, q))) P(x, y, c); } }
function line(x0, y0, x1, y1, c, fn) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy, k = 0;
  for (;;) { (fn ? fn(x0, y0, k) : P(x0, y0, c)); k++; if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
}

// ── 스프라이트: 도형으로 찍고 → 그늘 → 외곽선 ─────────────────
class Spr {
  constructor(w, h) { this.w = w; this.h = h; this.g = Array.from({ length: h }, () => Array(w).fill('.')); }
  get(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? '.' : this.g[y][x]; }
  px(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.g[y][x] = c; return this; }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.px(x + i, y + j, c); return this; }
  ell(cx, cy, rx, ry, c, maxY = 1e9) { for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) { const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry; if (dx * dx + dy * dy <= 1 && y <= maxY) this.px(x, y, c); } return this; }
  line(x0, y0, x1, y1, c, t = 1) { line(x0, y0, x1, y1, c, (x, y) => { for (let a = 0; a < t; a++) this.px(x, y + a, c); }); return this; }
  poly(pts, c, fn) {
    const ys = pts.map((p) => p[1]), y0 = Math.floor(Math.min(...ys)), y1 = Math.ceil(Math.max(...ys));
    for (let y = y0; y <= y1; y++) {
      const yc = y + 0.5, xs = [];
      for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; if ((a[1] <= yc) !== (b[1] <= yc)) xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0])); }
      xs.sort((p, q) => p - q);
      for (let k = 0; k + 1 < xs.length; k += 2) for (let x = Math.round(xs[k]); x < Math.round(xs[k + 1]); x++) this.px(x, y, fn ? fn(x, y) : c);
    }
    return this;
  }
  map(fn) { for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) { const c = fn(x, y, this.g[y][x]); if (c) this.g[y][x] = c; } return this; }
  // 빛 반대쪽 가장자리에 그늘 한 단
  shade(m, dx, dy, keep = '') {
    const o = this.g.map((r) => r.slice());
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const c = this.g[y][x]; if (!m[c] || keep.includes(c)) continue;
      const a = this.get(x + dx, y), b = this.get(x, y + dy);
      if (a === '.' || b === '.') o[y][x] = m[c];
    }
    this.g = o; return this;
  }
  outline(c = 'k') {
    const o = this.g.map((r) => r.slice());
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) if (this.g[y][x] === '.') {
      if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => { const n = this.get(x + a, y + b); return n !== '.' && n !== c; })) o[y][x] = c;
    }
    this.g = o; return this;
  }
  draw(ox, oy) { for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) P(ox + x, oy + y, this.g[y][x]); }
}
const SHADE = { s: 'S', w: 'W', v: 't', t: 'T', g: 'G', n: 'N', a: 'A', r: 'R', b: 'B', Y: 'T', W: 'p', y: 'Y', l: 'b', p: 'e' };

// ── 영웅 ─────────────────────────────────────────────────────
function sprPosu() {
  const s = new Spr(38, 42);
  s.rect(8, 37, 6, 2, 't').rect(16, 37, 6, 2, 't').px(14, 38, 't').px(22, 38, 't');
  s.rect(9, 31, 4, 6, 'w').rect(17, 31, 4, 6, 'w');
  [32, 34].forEach((y) => { s.rect(9, y, 4, 1, 'W').rect(17, y, 4, 1, 'W'); });
  s.rect(8, 26, 13, 5, 'v').rect(13, 29, 3, 2, '.');
  s.rect(8, 17, 13, 9, 'w');
  s.rect(8, 17, 4, 8, 'g').rect(17, 17, 4, 8, 'g');
  s.px(11, 19, 'Y').px(11, 22, 'Y');
  s.rect(8, 25, 13, 1, 'd');
  s.rect(19, 25, 3, 3, 'n').rect(19, 25, 3, 1, 'N').px(20, 26, 'Y');
  // 머리
  s.rect(9, 8, 3, 6, 'h');
  s.ell(15.5, 12, 5.4, 5, 's');
  s.rect(13, 16, 5, 1, 'S');
  s.ell(15.5, 7, 7.2, 5, 'n', 8);
  for (let x = 8; x <= 23; x++) s.px(x, 8, x % 2 ? 'v' : 't');
  s.px(15, 1, 'n').px(16, 1, 'n').px(16, 2, 't').px(13, 4, 't').px(18, 4, 't').px(11, 5, 'N').px(15, 6, 'N').px(20, 6, 'N').px(13, 7, 'N').px(18, 7, 'N').px(9, 6, 'n').px(22, 6, 'n').px(14, 0, 'n').px(17, 1, 't');
  for (let x = 8; x <= 23; x += 2) s.px(x, 9, x % 4 ? 't' : '.');
  s.rect(8, 9, 2, 6, 'n');
  // 얼굴 (오른쪽을 본다)
  s.px(16, 11, 'k').px(16, 12, 'k').px(19, 11, 'k').px(19, 12, 'k');
  s.px(15, 10, 'N').px(16, 10, 'N').px(19, 10, 'N').px(20, 10, 'N');
  s.px(15, 14, 'r').px(20, 14, 'r').px(17, 15, 'S').px(18, 15, 'S').px(21, 13, 's');
  // 뒷팔 + 손
  s.rect(6, 18, 3, 6, 'w').rect(6, 24, 2, 2, 's');
  // 화승총 (개머리 → 총구)
  s.line(3, 28, 11, 25, 'n', 2);
  s.line(11, 25, 36, 14, 'a');
  s.line(12, 26, 36, 15, 'A');
  s.px(11, 24, 'Y').px(12, 24, 'Y');
  // 앞팔 + 손 (총열을 받친다)
  s.rect(19, 18, 3, 3, 'w').rect(22, 19, 2, 2, 's');
  s.shade(SHADE, -1, 1, 'kYyrhSod');
  s.px(10, 27, 'o').px(9, 28, 'y');
  return s.outline();
}

function sprManshin() {
  const s = new Spr(38, 46);
  const o = 4;
  s.rect(10, 41 + o - 4, 3, 1, 'w').rect(17, 41 + o - 4, 3, 1, 'w');
  s.poly([[9, 33], [21, 33], [23, 41], [7, 41]], 'b');
  [11, 15, 19].forEach((x) => { for (let y = 35; y <= 40; y++) s.px(x + (y > 38 ? (x < 15 ? -1 : x > 15 ? 1 : 0) : 0), y, 'B'); });
  s.poly([[10, 26], [20, 26], [22, 33], [8, 33]], 'r', (x, y) => ((x + (y > 29 ? 1 : 0)) % 2 ? 'R' : 'r'));
  s.rect(10, 25, 11, 1, 'B').px(16, 26, 'b').px(16, 27, 'b').px(16, 28, 'r');
  s.rect(10, 18, 11, 7, 'r');
  s.line(12, 18, 15, 21, 'w').line(13, 18, 16, 21, 'B');
  // 머리
  s.ell(9.5, 10, 3.2, 3, 'h');
  s.rect(10, 10, 3, 7, 'h');
  s.ell(16.5, 13, 5.2, 5, 's');
  s.rect(14, 17, 5, 1, 'S');
  s.ell(16.5, 11, 6, 4, 'h', 10);
  s.line(11, 9, 22, 8, 'r'); s.line(11, 10, 22, 9, 'r');
  s.line(6, 9, 11, 11, 'Y');
  s.px(17, 13, 'k').px(18, 13, 'k').px(20, 13, 'k').px(21, 13, 'k');
  s.px(16, 15, 'r').px(22, 15, 'r').px(19, 16, 'R');
  // 오른팔 (부채를 높이)
  s.poly([[19, 19], [22, 18], [25, 11], [28, 12], [25, 21], [21, 23]], 'r');
  s.rect(25, 9, 2, 2, 's');
  // 오방색 부채
  const fc = ['b', 'r', 'y', 'w', 'h'];
  for (let y = 0; y <= 8; y++) for (let x = 18; x <= 34; x++) {
    const dx = x + 0.5 - 26, dy = y + 0.5 - 8.6, r = Math.hypot(dx, dy);
    if (r <= 7.6 && r >= 1.2 && dy < 0) { const a = Math.atan2(dy, dx) + Math.PI; s.px(x, y, fc[Math.min(4, Math.floor(a / Math.PI * 5))]); }
  }
  s.px(26, 9, 'Y');
  // 왼팔 + 방울 + 오색 천
  s.poly([[10, 19], [7, 20], [5, 26], [8, 27], [10, 23]], 'r');
  s.rect(5, 27, 2, 2, 's');
  s.line(5, 29, 1, 36, 'b').line(6, 29, 2, 38, 'r').line(6, 30, 4, 39, 'y').line(5, 30, 0, 34, 'w');
  [[4, 30], [6, 31], [3, 32], [5, 33], [7, 33], [4, 35]].forEach(([x, y]) => s.px(x, y, 'Y'));
  s.px(5, 31, 'y').px(6, 33, 'y');
  s.shade(SHADE, -1, 1, 'kYyhSRBwbo');
  return s.outline();
}

function sprMonk() {
  const s = new Spr(36, 50);
  // 육환장
  s.rect(26, 11, 1, 38, 'n').rect(27, 11, 1, 38, 'N');
  s.ell(27, 6.5, 3.2, 4.4, 'Y').ell(27, 6.5, 1.6, 2.6, '.');
  s.px(26, 1, 'Y').px(27, 1, 'y').px(26, 0, 'y');
  s.px(26, 6, 'y').px(27, 7, 'y');
  [[21, 3], [20, 6], [21, 9], [32, 3], [33, 6], [32, 9]].forEach(([x, y]) => { s.rect(x - 1, y - 1, 3, 3, 'Y').px(x, y, '.'); s.px(x - 1, y - 1, 'y'); });
  // 몸
  s.poly([[8, 24], [21, 24], [24, 47], [5, 47]], 'a');
  for (let y = 36; y < 47; y++) { s.px(10, y, 'A'); s.px(19 + (y > 42 ? 1 : 0), y, 'A'); }
  s.poly([[8, 25], [4, 27], [3, 37], [7, 38], [9, 31]], 'a');
  s.poly([[8, 24], [15, 24], [23, 37], [22, 40], [6, 40]], 'n', (x, y) => (x % 4 === 0 || y % 4 === 0) ? 'N' : ((x >> 2) + (y >> 2)) % 3 === 0 ? 't' : 'n');
  s.line(15, 24, 23, 38, 'Y');
  s.poly([[20, 25], [23, 26], [25, 32], [22, 33], [20, 29]], 'a');
  s.rect(25, 31, 2, 2, 's');
  s.rect(9, 47, 4, 1, 'A').rect(16, 47, 4, 1, 'A');
  // 머리 (민머리)
  s.ell(15.5, 17.5, 5.6, 5.8, 's');
  s.px(9, 17, 's').px(9, 18, 'S');
  s.rect(13, 23, 5, 1, 'S');
  s.px(17, 13, 'v').px(18, 13, 'v').px(18, 14, 'v');
  s.px(16, 18, 'k').px(17, 18, 'k').px(19, 18, 'k').px(20, 18, 'k');
  s.px(16, 16, 'N').px(17, 16, 'N').px(19, 16, 'N').px(20, 16, 'N');
  s.px(15, 20, 'r').px(21, 20, 'r').px(18, 21, 'S').px(19, 21, 'S');
  // 염주
  [[12, 24], [12, 25], [13, 26], [13, 27], [14, 28], [15, 29], [16, 28], [17, 27], [17, 26], [18, 25], [18, 24]].forEach(([x, y]) => s.px(x, y, 'd'));
  s.px(15, 30, 'o').px(15, 31, 'o');
  s.shade(SHADE, -1, 1, 'kYyhSdoN');
  return s.outline();
}

function sprBoss() {
  const s = new Spr(70, 70);
  // 노 (치켜든다)
  s.line(42, 60, 63, 10, 'n', 2);
  const ux = 21 / 50, uy = -1, ln = Math.hypot(ux, uy), ax = ux / ln, ay = uy / ln, nx = -ay, ny = ax;
  const bx = 63, by = 10, pts = [[bx + nx * 3, by + ny * 3], [bx + ax * 13 + nx * 3, by + ay * 13 + ny * 3], [bx + ax * 15, by + ay * 15], [bx + ax * 13 - nx * 3, by + ay * 13 - ny * 3], [bx - nx * 3, by - ny * 3]];
  s.poly(pts, 'n');
  // 도롱이: 세 단, 단마다 밝은 짚 끝 + 어두운 술
  s.poly([[25, 24], [40, 24], [47, 32], [52, 46], [56, 60], [8, 60], [12, 46], [17, 32]], 't');
  for (let x = 8; x <= 56; x++) { const k = (x * 7) % 5; for (let j = 0; j < (k > 2 ? 3 : 1); j++) if (s.get(x, 59) !== '.') s.px(x, 60 + j, 't'); }
  s.map((x, y, c) => (c === 't' && y > 25 && (x % 2 === 0) && ((y * 3 + x) % 5 < 3)) ? 'T' : null);
  s.map((x, y, c) => (c === 't' && y > 25 && x < 26 && ((x + y) % 4 === 0)) ? 'v' : null);
  [36, 48].forEach((yb) => {
    for (let x = 0; x < 70; x++) {
      if (s.get(x, yb) === '.') continue;
      const d = (x % 3 === 0) ? 1 : 0;
      s.px(x, yb + d, 'N'); if (s.get(x, yb + d + 1) !== '.') s.px(x, yb + d + 1, 'T');
      if (s.get(x, yb - 1) !== '.') s.px(x, yb - 1, x < 30 ? 'v' : 't');
    }
  });
  s.poly([[22, 22], [42, 22], [45, 28], [19, 28]], 'v');
  for (let x = 19; x <= 45; x += 2) s.px(x, 29, 'v');
  for (let x = 20; x <= 44; x += 3) s.px(x, 27, 't');
  // 삿갓 밑으로 흘러내린 흰 머리
  s.line(24, 22, 19, 35, 'W').line(25, 22, 21, 33, 'p').line(23, 23, 17, 31, 'W');
  // 빈 손 (삯을 청한다)
  s.poly([[18, 29], [5, 33], [5, 37], [19, 35]], 't');
  s.rect(0, 35, 5, 2, 'w').px(0, 34, 'w').px(2, 34, 'w').px(4, 37, 'W');
  // 노 쥔 손
  s.poly([[39, 26], [45, 26], [51, 33], [48, 37], [41, 32]], 't');
  s.rect(49, 33, 3, 3, 'w');
  // 삿갓
  s.poly([[33, 0], [59, 18], [57, 21], [9, 21], [7, 18]], 'v');
  s.map((x, y, c) => (c === 'v' && y < 21 && ((Math.round((x - 33) / Math.max(1, y) * 6) % 3 === 0 && y > 3) || y === 10 || y === 15)) ? 't' : null);
  s.rect(10, 21, 46, 1, 'N');
  // 얼굴: 그늘 + 눈빛
  s.ell(32.5, 25, 8.4, 4.6, 'h');
  s.px(26, 24, 'c').px(27, 23, 'c').px(28, 23, 'w').px(28, 24, 'c').px(27, 24, 'c');
  s.px(36, 23, 'w').px(37, 23, 'c').px(36, 24, 'c').px(37, 24, 'c').px(38, 24, 'c');
  s.px(38, 26, 'c').px(38, 27, 'l');
  s.shade({ t: 'T', v: 't', n: 'N', w: 'W' }, 1, 1, 'hkcNl');
  s.outline();
  return s;
}

// ── 장면 ─────────────────────────────────────────────────────
function sky() {
  const cols = ['h', 'x', 'u', 'i', 'j', 'e'], y0 = 11, y1 = 80;
  for (let y = y0; y < y1; y++) {
    const t = (y - y0) / (y1 - y0) * (cols.length - 1), i = Math.min(cols.length - 2, Math.floor(t)), f = t - i;
    const lv = Math.max(0, Math.min(1, (f - 0.55) / 0.45));
    for (let x = 0; x < LW; x++) P(x, y, bay(x, y) < lv ? cols[i + 1] : cols[i]);
  }
  // 달무리 + 달
  const mx = 172, my = 36;
  for (let y = my - 24; y <= my + 24; y++) for (let x = mx - 24; x <= mx + 24; x++) {
    const r = Math.hypot(x + 0.5 - mx, y + 0.5 - my);
    if (r > 12 && r < 22) { const lv = r < 15 ? 0.5 : r < 18 ? 0.25 : 0.1; if (bay(x, y) < lv) P(x, y, r < 15 ? 'p' : 'e'); }
  }
  ell(mx, my, 11.5, 11.5, 'm');
  ell(mx, my, 11.5, 11.5, 'Y', (x, y) => Math.hypot(x + 0.5 - (mx + 3), y + 0.5 - (my - 3)) > 11.5);
  [[168, 32], [169, 32], [176, 40], [177, 40], [176, 41], [171, 41]].forEach(([x, y]) => P(x, y, 'Y'));
  // 별
  [[20, 18], [52, 30], [88, 16], [120, 26], [140, 14], [210, 18], [236, 32], [262, 15], [300, 24], [312, 44], [8, 46], [104, 44], [70, 52], [288, 56], [150, 54]].forEach(([x, y], k) => {
    P(x, y, k % 3 ? 'W' : 'w');
    if (k % 4 === 0) { P(x - 1, y, 'e'); P(x + 1, y, 'e'); P(x, y - 1, 'e'); P(x, y + 1, 'e'); }
  });
  // 구름 (윗가장자리는 달빛)
  const cloud = (cx, cy, parts) => {
    parts.forEach(([dx, dy, rx, ry]) => ell(cx + dx, cy + dy, rx, ry, 'u'));
    parts.forEach(([dx, dy, rx, ry]) => ell(cx + dx, cy + dy, rx, ry, 'j', (x, y) => {
      const below = parts.some(([ex, ey, sx, sy]) => { const q = ((x + 0.5 - cx - ex) / sx) ** 2 + ((y - 0.5 - cy - ey) / sy) ** 2; return q <= 1; });
