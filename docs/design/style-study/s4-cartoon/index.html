<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>저승굿 화풍 시안 s4 · 카툰 셀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #120f26; }
  #root { width: 1280px; height: 800px; overflow: hidden; }
  svg text { font-family: 'Jua', sans-serif; }
  .num { font-family: 'Do Hyeon', 'Jua', sans-serif; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ─────────────────────────────────────────────────────────────
// s4 카툰 셀 — 굵고 고른 먹선 + 그림자 한 단(셀) + 3등신 + 밤빛으로 누른 채도
// 모든 그림은 코드(SVG)로 그린다. 외부 이미지 없음.
// ─────────────────────────────────────────────────────────────
const INK = '#1d1633';
const W = 1280, H = 800;
let uid = 0;
const id = (p = 'i') => p + (uid++);

const E = (cx, cy, rx, ry = rx) =>
  `M${cx - rx},${cy} a${rx},${ry} 0 1,0 ${rx * 2},0 a${rx},${ry} 0 1,0 ${-rx * 2},0 Z`;
const RR = (x, y, w, h, r) =>
  `M${x + r},${y} h${w - 2 * r} a${r},${r} 0 0 1 ${r},${r} v${h - 2 * r} a${r},${r} 0 0 1 ${-r},${r} h${-(w - 2 * r)} a${r},${r} 0 0 1 ${-r},${-r} v${-(h - 2 * r)} a${r},${r} 0 0 1 ${r},${-r} Z`;

// 셀 칠: 바탕은 그림자색, 빛 쪽으로 민 같은 모양을 밝은 색으로 덮는다 → 반대편에 그림자 초승달이 한 단 남는다
let LIGHT = [5, -4];
function part(d, base, shade, o = {}) {
  const c = id('c'), L = o.L || LIGHT, sw = o.sw ?? 3.5;
  return `<clipPath id="${c}"><path d="${d}"/></clipPath>` +
    `<path d="${d}" fill="${shade}"/>` +
    `<g clip-path="url(#${c})"><path d="${d}" fill="${base}" transform="translate(${L[0]},${L[1]})"/>${o.inner || ''}</g>` +
    (sw ? `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>` : '');
}
// 팔다리: 먹선 두른 관
const tube = (d, color, w, shade) =>
  `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 7}" stroke-linecap="round" stroke-linejoin="round"/>` +
  `<path d="${d}" fill="none" stroke="${shade || color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>` +
  (shade ? `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w * 0.55}" stroke-linecap="round" stroke-linejoin="round" transform="translate(${LIGHT[0] * 0.4},${LIGHT[1] * 0.4})"/>` : '');
const line = (d, w = 3.5, c = INK, extra = '') =>
  `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
const circ = (x, y, r, fill, sw = 3) =>
  `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${INK}" stroke-width="${sw}"/>`;
function T(x, y, s, size, fill, o = {}) {
  const st = o.stroke ? `stroke="${o.stroke}" stroke-width="${o.sw || 4}" stroke-linejoin="round" paint-order="stroke"` : '';
  return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${o.anchor || 'start'}" ${st} ${o.cls ? `class="${o.cls}"` : ''} ${o.ls ? `letter-spacing="${o.ls}"` : ''}>${s}</text>`;
}

const SKIN = ['#f3c7a0', '#cf9070'];

// ── 영웅: 포수 ────────────────────────────────────────────────
function posu() {
  LIGHT = [5, -4];
  let s = '';
  // 신
  s += part(E(-13, -4, 13, 6.5), '#b08a4e', '#7e5f30') + part(E(14, -4, 13, 6.5), '#b08a4e', '#7e5f30');
  // 행전
  s += part(RR(-20, -26, 13, 20, 4), '#efe6d0', '#bfb39b') + part(RR(7, -26, 13, 20, 4), '#efe6d0', '#bfb39b');
  // 짧은 바지
  s += part('M-26,-58 Q-29,-34 -22,-22 L-5,-22 L0,-36 L5,-22 L22,-22 Q29,-34 26,-58 Z', '#cdb487', '#9a845d');
  // 저고리
  s += part('M-25,-102 Q-31,-76 -27,-52 L27,-52 Q31,-76 25,-102 Q0,-110 -25,-102 Z', '#ebe2cb', '#b7ab93');
  // 조끼
  s += part('M-25,-102 Q-31,-76 -27,-52 L-6,-52 L-4,-100 Z', '#2f8068', '#1e5646');
  s += part('M25,-102 Q31,-76 27,-52 L6,-52 L4,-100 Z', '#2f8068', '#1e5646');
  s += circ(-9, -80, 2.6, '#e9c46a', 2) + circ(-9, -66, 2.6, '#e9c46a', 2);
  // 띠
  s += part(RR(-28, -60, 56, 8, 3), '#5f3b27', '#3c2316');
  // 화약 주머니
  s += part('M15,-58 Q31,-58 32,-42 Q31,-27 22,-27 Q11,-29 11,-42 Q11,-55 15,-58 Z', '#9a6430', '#663e18');
  s += line('M14,-55 Q22,-50 30,-55', 2.5) + line('M22,-52 l-3,-9', 2.5);
  s += `<path d="M18,-47 l3,3 l3,-3 l3,3" fill="none" stroke="#e9c46a" stroke-width="2"/>`;
  // 화승총 (몸 앞으로 비스듬히, 총구는 보스 쪽)
  const gun =
    part(RR(0, -7, 46, 14, 6), '#8a5530', '#5b3519') +
    part(RR(40, -5, 14, 10, 2), '#7c8299', '#4f546a') +
    part(RR(50, -3.5, 82, 7, 3), '#7c8299', '#4f546a') +
    part(RR(126, -5, 8, 10, 2), '#7c8299', '#4f546a') +
    part(RR(72, -5, 6, 10, 2), '#c99a3e', '#94701f', { sw: 2.5 });
  s += `<g transform="translate(-36,-52) rotate(-22)">${gun}</g>`;
  // 화승(불붙은 심지)
  s += line('M8,-62 q-8,12 -2,22 q6,10 -6,16', 3.2, INK) + line('M8,-62 q-8,12 -2,22 q6,10 -6,16', 1.6, '#e3cf9a');
  s += `<circle cx="0" cy="-24" r="8" fill="#ff8a3d" opacity="0.35"/><circle cx="0" cy="-24" r="3.4" fill="#ffcf5a" stroke="${INK}" stroke-width="2"/>`;
  // 팔 (두 손으로 총을 쥔다)
  s += tube('M-20,-96 Q-30,-78 -16,-64', '#ebe2cb', 12, '#b7ab93');
  s += tube('M20,-96 Q40,-90 38,-80', '#ebe2cb', 12, '#b7ab93');
  s += circ(-15, -63, 7.5, SKIN[0]) + circ(38, -79, 7.5, SKIN[0]);
  // 머리
  s += part(E(0, -132, 29, 27), SKIN[0], SKIN[1]);
  // 털모자 귀덮개
  s += part('M-38,-136 Q-46,-110 -31,-100 Q-20,-106 -22,-134 Z', '#8d5c37', '#5e3a20');
  s += part('M34,-136 Q41,-112 31,-102 Q22,-108 22,-134 Z', '#8d5c37', '#5e3a20');
  // 털모자: 털뭉치를 겹쳐 바깥만 먹선
  const puffs = [];
  for (let i = 0; i <= 10; i++) { const a = Math.PI * (1.04 + 0.92 * i / 10); puffs.push([31 * Math.cos(a), -140 + 27 * Math.sin(a), 7 + (i % 2) * 1.5]); }
  for (let i = 0; i <= 9; i++) puffs.push([-31 + i * 6.9, -139 + (i % 2) * 2, 6.5]);
  puffs.push([0, -152, 21], [3, -176, 7]);
  s += puffs.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r + 3.2}" fill="${INK}"/>`).join('');
  s += puffs.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#64402a"/>`).join('');
  s += puffs.map(([x, y, r]) => `<circle cx="${x + 2.5}" cy="${y - 2.5}" r="${r * 0.82}" fill="#9a6a42"/>`).join('');
  s += line('M-16,-158 q4,-4 8,0 M4,-164 q4,-4 8,0 M14,-152 q4,-4 8,0', 2.5, '#4a2c16');
  // 얼굴 (오른쪽, 보스를 본다)
  s += `<ellipse cx="-1" cy="-127" rx="3.6" ry="5" fill="${INK}"/><ellipse cx="17" cy="-127" rx="3.6" ry="5" fill="${INK}"/>`;
  s += `<circle cx="0" cy="-129" r="1.3" fill="#fff"/><circle cx="18" cy="-129" r="1.3" fill="#fff"/>`;
  s += line('M-9,-138 L5,-134', 4) + line('M11,-134 L25,-139', 4);
  s += line('M9,-121 q5,3 0,6', 2.5);
  s += line('M2,-112 q7,2 13,-2', 3);
  s += `<circle cx="25" cy="-116" r="4.2" fill="#e5604f"/><circle cx="-11" cy="-116" r="4.2" fill="#e5604f"/>`;
  s += `<g fill="${INK}" opacity="0.45"><circle cx="-2" cy="-108" r="1"/><circle cx="4" cy="-106" r="1"/><circle cx="10" cy="-106" r="1"/><circle cx="16" cy="-108" r="1"/></g>`;
  return s;
}

// ── 영웅: 만신 ────────────────────────────────────────────────
function manshin() {
  LIGHT = [5, -4];
  let s = '';
  // 쪽머리(뒤)
  s += part(E(-22, -150, 13, 12), '#2d2546', '#1a152e');
  s += line('M-40,-156 L-4,-146', 4, INK) + line('M-40,-156 L-4,-146', 2, '#e9c46a');
  // 버선
  s += part(E(-13, -3, 11, 5.5), '#f2ead8', '#c4b9a2') + part(E(14, -3, 11, 5.5), '#f2ead8', '#c4b9a2');
  // 푸른 치마
  s += part('M-30,-62 Q-42,-28 -44,-6 Q0,3 44,-6 Q42,-28 30,-62 Z', '#2f62c4', '#1f418a',
    { inner: line('M-14,-50 Q-20,-24 -20,-4 M10,-50 Q14,-24 16,-4', 2.5, '#1f418a') });
  // 홍철릭 (아래 주름)
  s += part('M-25,-104 Q-31,-82 -31,-66 Q-42,-46 -40,-30 Q0,-22 40,-30 Q42,-46 31,-66 Q31,-82 25,-104 Q0,-112 -25,-104 Z', '#dd3a3e', '#a3232f',
    { inner: line('M-26,-58 L-30,-30 M-14,-60 L-15,-26 M0,-60 L0,-25 M14,-60 L15,-26 M26,-58 L30,-30', 2.5, '#a3232f') });
  // 동정 (흰 깃)
  s += line('M-15,-106 L0,-84 L15,-106', 9, INK) + line('M-15,-106 L0,-84 L15,-106', 4.5, '#f4efe2');
  // 띠(세조대) + 술
  s += part(RR(-31, -70, 62, 8, 3), '#26346a', '#17204a');
  s += line('M6,-63 L4,-44', 3.5) + part('M0,-46 L8,-46 L10,-34 L-2,-34 Z', '#2f62c4', '#1f418a', { sw: 2.5 });
  // 왼팔 + 방울
  s += part('M-18,-102 Q-40,-94 -48,-70 L-34,-60 Q-28,-78 -14,-86 Z', '#dd3a3e', '#a3232f');
  s += circ(-42, -60, 7, SKIN[0]);
  s += line('M-42,-58 L-44,-40', 5, INK) + line('M-42,-58 L-44,-40', 2.5, '#c99a3e');
  // 방울 오색 천
  const rib = ['#3a6fd8', '#e0453a', '#f2c230', '#f4efe0', '#4b4466'];
  rib.forEach((c, i) => { s += line(`M-44,-42 q${-8 + i * 4},14 ${-10 + i * 5},34`, 6, INK) + line(`M-44,-42 q${-8 + i * 4},14 ${-10 + i * 5},34`, 3, c); });
  const bells = [[-44, -36], [-52, -32], [-36, -32], [-48, -26], [-40, -26], [-44, -18], [-56, -24]];
  bells.forEach(([x, y]) => { s += part(E(x, y, 5.2, 5.2), '#f2c53d', '#b88b1c', { sw: 2.5 }) + line(`M${x - 2},${y + 1.5} h4`, 1.6); });
  // 오른팔 + 오방색 부채
  s += part('M16,-102 Q36,-112 48,-134 L60,-120 Q46,-96 26,-84 Z', '#dd3a3e', '#a3232f');
  const fx = 56, fy = -134, fr = 38;
  const fan = ['#3a6fd8', '#e0453a', '#f2c230', '#f4efe0', '#4b4466'];
  const a0 = -175, a1 = -25, n = 5;
  for (let i = 0; i < n; i++) {
    const t0 = (a0 + (a1 - a0) * i / n) * Math.PI / 180, t1 = (a0 + (a1 - a0) * (i + 1) / n) * Math.PI / 180;
    const p = `M${fx},${fy} L${fx + fr * Math.cos(t0)},${fy + fr * Math.sin(t0)} A${fr},${fr} 0 0 1 ${fx + fr * Math.cos(t1)},${fy + fr * Math.sin(t1)} Z`;
    s += `<path d="${p}" fill="${fan[i]}" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/>`;
  }
  s += `<path d="M${fx + fr * Math.cos(a0 * Math.PI / 180)},${fy + fr * Math.sin(a0 * Math.PI / 180)} A${fr},${fr} 0 0 1 ${fx + fr * Math.cos(a1 * Math.PI / 180)},${fy + fr * Math.sin(a1 * Math.PI / 180)}" fill="none" stroke="${INK}" stroke-width="4"/>`;
  s += `<path d="M${fx},${fy} m-12,0 a12,12 0 0 1 24,0" fill="#c99a3e" stroke="${INK}" stroke-width="2.5"/>`;
  s += circ(52, -128, 7, SKIN[0]);
  // 머리
  s += part(E(0, -132, 28, 27), SKIN[0], SKIN[1]);
  s += part('M-30,-126 Q-34,-164 0,-164 Q32,-164 30,-128 Q22,-150 4,-150 Q-6,-142 -12,-150 Q-22,-146 -30,-126 Z', '#2d2546', '#1a152e');
  // 붉은 머리띠
  s += line('M-29,-140 Q0,-158 29,-142', 7.5, INK) + line('M-29,-140 Q0,-158 29,-142', 4, '#e0453a');
  // 얼굴 — 공수 직전, 눈을 반쯤 감은 무아
  s += line('M-4,-128 q5,-4 10,0', 3.2) + line('M13,-128 q5,-4 10,0', 3.2);
  s += line('M-5,-129 l-3,-2 M22,-129 l3,-2', 2.2);
  s += `<ellipse cx="11" cy="-114" rx="3.6" ry="4" fill="#7a2030" stroke="${INK}" stroke-width="2"/>`;
  s += `<circle cx="24" cy="-118" r="4.2" fill="#e5604f"/><circle cx="-10" cy="-118" r="4.2" fill="#e5604f"/>`;
  return s;
}

// ── 영웅: 승려 ────────────────────────────────────────────────
function seung() {
  LIGHT = [5, -4];
  let s = '';
  // 육환장 (오른손)
  s += tube('M52,-2 L52,-206', '#7a4d26', 6.5, '#55331a');
  const rx = 17, ry = 21, cx = 52, cy = -226;
  s += `<path d="${E(cx, cy, rx, ry)}" fill="none" stroke="${INK}" stroke-width="10"/><path d="${E(cx, cy, rx, ry)}" fill="none" stroke="#e0ad45" stroke-width="5"/>`;
  s += line(`M${cx},${cy - ry - 2} l0,-12`, 8) + line(`M${cx},${cy - ry - 2} l0,-12`, 3.5, '#e0ad45');
  s += part(E(cx, cy - ry - 16, 5, 6), '#e0ad45', '#a7781f', { sw: 2.5 });
  s += line(`M${cx},${cy + ry} L${cx},${cy - 6}`, 6) + line(`M${cx},${cy + ry} L${cx},${cy - 6}`, 2.5, '#e0ad45');
  [200, 168, 138, -20, 12, 42].forEach((deg) => {
    const a = deg * Math.PI / 180, x = cx + (rx + 1) * Math.cos(a), y = cy + (ry + 1) * Math.sin(a) + 6;
    s += `<circle cx="${x}" cy="${y}" r="6.5" fill="none" stroke="${INK}" stroke-width="7.5"/><circle cx="${x}" cy="${y}" r="6.5" fill="none" stroke="#f0c25a" stroke-width="3.5"/>`;
  });
  // 신
  s += part(E(-14, -4, 14, 6.5), '#4b4f62', '#2f3242') + part(E(15, -4, 14, 6.5), '#4b4f62', '#2f3242');
  // 장삼
  s += part('M-30,-102 Q-38,-62 -40,-8 Q0,1 40,-8 Q38,-62 30,-102 Q0,-112 -30,-102 Z', '#9198ad', '#676d83',
    { inner: line('M-18,-60 Q-22,-30 -24,-6 M16,-56 Q20,-30 24,-8', 2.5, '#676d83') });
  // 왼쪽 소매 (늘어뜨림)
  s += part('M-24,-100 Q-48,-82 -50,-46 Q-42,-36 -30,-42 Q-28,-66 -18,-80 Z', '#9198ad', '#676d83');
  // 가사 (조각보)
  const kasa = 'M-32,-102 Q-12,-108 5,-99 L36,-48 Q33,-32 22,-26 L-36,-30 Q-41,-62 -32,-102 Z';
  let patches = '';
  const pc = ['#a8653a', '#8c4d26', '#b3713f', '#9a5a2f', '#7f4521'];
  for (let i = 0; i < 6; i++) for (let j = 0; j < 7; j++) {
    patches += `<rect x="${-40 + i * 13}" y="${-110 + j * 13}" width="13" height="13" fill="${pc[(i * 3 + j * 2) % 5]}"/>`;
  }
  patches = `<g transform="rotate(-8)">${patches}</g>`;
  let grid = '';
  for (let i = 0; i <= 6; i++) grid += `M${-40 + i * 13},-112 L${-40 + i * 13},-18 `;
  for (let j = 0; j <= 7; j++) grid += `M-44,${-110 + j * 13} L40,${-110 + j * 13} `;
  s += part(kasa, '#9a5a2f', '#6a3818', {
    inner: `<g opacity="0.85">${patches}</g><path d="${grid}" stroke="#4f2810" stroke-width="2" fill="none" transform="rotate(-8)"/>` +
      `<path d="${kasa}" fill="#4a2410" opacity="0.38" transform="translate(-5,4)" clip-rule="evenodd"/>`
  });
  s += circ(-14, -90, 4, '#e0ad45', 2.5);
  // 오른팔 (육환장을 쥔다)
  s += part('M20,-100 Q42,-92 48,-70 L56,-60 Q44,-52 34,-60 Q26,-72 16,-82 Z', '#9198ad', '#676d83');
  s += circ(52, -70, 8, SKIN[0]);
  // 머리
  s += part(E(-28, -128, 5.5, 7.5), SKIN[0], SKIN[1], { sw: 3 });
  s += part(E(0, -134, 30, 29), SKIN[0], SKIN[1]);
  s += `<path d="M-26,-142 Q-2,-170 26,-144 Q4,-160 -26,-142 Z" fill="#9fa8c8" opacity="0.45"/>`;
  s += `<ellipse cx="12" cy="-154" rx="7" ry="4" fill="#fff" opacity="0.75" transform="rotate(-25 12 -154)"/>`;
  // 얼굴 — 선두, 지그시 감은 눈과 굵은 눈썹
  s += line('M-4,-128 q5,4 10,0', 3.2) + line('M13,-128 q5,4 10,0', 3.2);
  s += line('M-7,-137 L6,-139', 4.5) + line('M12,-139 L25,-137', 4.5);
  s += line('M10,-122 q4,3 0,5', 2.5);
  s += line('M3,-112 q7,4 13,0', 3);
  s += `<circle cx="25" cy="-117" r="4.2" fill="#e5604f"/><circle cx="-11" cy="-117" r="4.2" fill="#e5604f"/>`;
  // 염주
  for (let i = 0; i <= 14; i++) {
    const t = i / 14, a = Math.PI * (0.05 + 0.9 * t);
    const x = -20 * Math.cos(a) + 0, y = -104 + 26 * Math.sin(a);
    s += circ(x, y, 4, i === 7 ? '#c48a3a' : '#4a3226', 2);
  }
  s += line('M0,-74 L0,-64', 3) + `<path d="M-4,-64 L4,-64 L6,-52 L-6,-52 Z" fill="#c48a3a" stroke="${INK}" stroke-width="2.5"/>`;
  return s;
}

// ── 굿상 ──────────────────────────────────────────────────────
function gutsang() {
  LIGHT = [3, -3];
  let s = '';
  s += `<ellipse cx="0" cy="2" rx="62" ry="9" fill="#000" opacity="0.35"/>`;
  s += part('M-44,-38 L-40,0 L-32,0 L-34,-38 Z', '#7a2f2a', '#521c1a') + part('M44,-38 L40,0 L32,0 L34,-38 Z', '#7a2f2a', '#521c1a');
  s += part('M-56,-46 L56,-46 L50,-36 L-50,-36 Z', '#a4433a', '#6e2a26');
  s += part(RR(-58, -54, 116, 10, 4), '#c2574a', '#8a3a32');
  // 초 두 자루
  [[-40, -54], [40, -54]].forEach(([x, y]) => {
    s += part(RR(x - 5, y - 30, 10, 30, 3), '#f6efdc', '#c9bfa6', { sw: 3 });
    s += `<circle cx="${x}" cy="${y - 40}" r="16" fill="#ffcf6a" opacity="0.22"/>`;
    s += part(`M${x},${y - 50} Q${x + 7},${y - 38} ${x},${y - 32} Q${x - 7},${y - 38} ${x},${y - 50} Z`, '#ffd25e', '#ff8f3a', { sw: 2.5 });
  });
  // 정화수 사발
  s += part('M-26,-66 Q-24,-54 -12,-54 Q0,-54 2,-66 Z', '#f4f1ea', '#c3c0b8', { sw: 3 });
  s += part(E(-12, -66, 14, 4), '#9fd4ff', '#6aa6d8', { sw: 2.5 });
  // 지화 한 송이
  s += part('M14,-54 L26,-54 L24,-68 L16,-68 Z', '#3a5fa8', '#26407a', { sw: 2.5 });
  s += line('M20,-68 L20,-80', 3, '#2f7a4a');
  s += part('M8,-88 Q14,-100 20,-92 Q26,-100 32,-88 Q38,-80 28,-76 Q20,-72 12,-76 Q2,-80 8,-88 Z', '#ff8fb1', '#d65a86', { sw: 2.5 });
  s += part(E(20, -86, 6, 5), '#ffd0de', '#ff8fb1', { sw: 2 });
  return s;
}

function card(c, k) {
  const w = 152, h = 214;
  let s = `<path d="${RR(4, 6, w, h, 16)}" fill="#0b0918" opacity="0.6"/>`;
  s += `<path d="${RR(0, 0, w, h, 16)}" fill="${c.frame}" stroke="${INK}" stroke-width="4"/>`;
  s += `<path d="${RR(5, 5, w - 10, h - 10, 12)}" fill="none" stroke="${c.dark}" stroke-width="3"/>`;
  // 이름 띠
  s += `<path d="${RR(10, 9, w - 20, 28, 10)}" fill="#fff3da" stroke="${INK}" stroke-width="3"/>`;
  s += T(w / 2 + 8, 30, c.name, c.name.length > 4 ? 16.5 : 19, INK, { anchor: 'middle' });
  // 그림 창
  const ac = id('a');
  s += `<clipPath id="${ac}"><path d="${RR(10, 42, 132, 76, 8)}"/></clipPath>`;
  s += `<g clip-path="url(#${ac})"><g transform="translate(10,42)">${cardArt(k)}</g></g>`;
  s += `<path d="${RR(10, 42, 132, 76, 8)}" fill="none" stroke="${INK}" stroke-width="3.5"/>`;
  // 종류 리본
  s += `<path d="${RR(26, 112, 100, 22, 11)}" fill="${c.dark}" stroke="${INK}" stroke-width="3"/>`;
  s += `<circle cx="40" cy="123" r="5" fill="${c.tag}" stroke="${INK}" stroke-width="2"/>`;
  s += T(83, 128.5, `${c.type} · ${c.who}`, 14, '#fff', { anchor: 'middle', stroke: INK, sw: 3 });
  // 글상자
  s += `<path d="${RR(10, 138, 132, 68, 10)}" fill="#fff3da" stroke="${INK}" stroke-width="3"/>`;
  const n = c.text.length, y0 = 172 - (n - 1) * 9.5;
  c.text.forEach((t, i) => { s += T(w / 2, y0 + i * 19, t, 15, '#2a2240', { anchor: 'middle' }); });
  // 비용
  s += `<circle cx="10" cy="10" r="20" fill="#2a2347" stroke="${INK}" stroke-width="4"/>`;
  s += `<circle cx="10" cy="10" r="14" fill="#ffd25e" stroke="${INK}" stroke-width="2.5"/>`;
  s += T(10, 19, c.cost, 26, INK, { anchor: 'middle', cls: 'num' });
  return s;
}
