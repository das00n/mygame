<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>저승굿 화풍 시안 s6 · 애니메·서브컬처 2D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Barlow+Condensed:ital,wght@1,600;1,700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #070a1c; }
  #root { width: 1280px; height: 800px; overflow: hidden; }
  svg text { font-family: 'Noto Sans KR', sans-serif; }
  .n { font-family: 'Barlow Condensed', 'Noto Sans KR', sans-serif; font-style: italic; font-weight: 700; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ─────────────────────────────────────────────────────────────
// s6 애니메·서브컬처 2D — 맑은 선화 + 셀 2단 + 부드러운 그라데이션 + 림라이트,
// 광택 UI와 빛 효과. 전부 코드(SVG)로 그린다.
// ─────────────────────────────────────────────────────────────
const W = 1280, H = 800;
let uid = 0;
const id = (p = 'i') => p + (uid++);
const E = (cx, cy, rx, ry = rx) => `M${cx - rx},${cy} a${rx},${ry} 0 1,0 ${rx * 2},0 a${rx},${ry} 0 1,0 ${-rx * 2},0 Z`;
const RR = (x, y, w, h, r) => `M${x + r},${y} h${w - 2 * r} a${r},${r} 0 0 1 ${r},${r} v${h - 2 * r} a${r},${r} 0 0 1 ${-r},${r} h${-(w - 2 * r)} a${r},${r} 0 0 1 ${-r},${-r} v${-(h - 2 * r)} a${r},${r} 0 0 1 ${r},${-r} Z`;

// 빛: 주광은 왼쪽 위(앞), 림은 오른쪽(달·원귀의 푸른빛)
let KEY = [-5, -4], RIM = [-2.6, 0];
// 재질 = { b: 밝은 면, s: 그림자, r: 림, l: 선 }
function P(d, m, o = {}) {
  const c = id('c'), L = o.L || KEY, R = o.R || RIM, sw = o.sw ?? 1.5;
  let s = `<clipPath id="${c}"><path d="${d}"/></clipPath><path d="${d}" fill="${m.s}"/><g clip-path="url(#${c})">`;
  s += `<path d="${d}" fill="${m.b}" transform="translate(${L[0]},${L[1]})"/>`;
  if (o.inner) s += o.inner;
  if (o.soft !== false) s += `<path d="${d}" fill="url(#soft)"/>`;
  if (m.r && o.rim !== false) {
    const k = id('m');
    s += `<mask id="${k}"><path d="${d}" fill="#fff"/><path d="${d}" fill="#000" transform="translate(${R[0]},${R[1]})"/></mask><path d="${d}" fill="${m.r}" mask="url(#${k})"/>`;
  }
  s += `</g>`;
  if (sw) s += `<path d="${d}" fill="none" stroke="${m.l}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`;
  return s;
}
const L = (d, c, w = 1.4, extra = '') => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
function T(x, y, s, size, fill, o = {}) {
  const st = o.stroke ? `stroke="${o.stroke}" stroke-width="${o.sw || 3}" stroke-linejoin="round" paint-order="stroke"` : '';
  return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${o.anchor || 'start'}" font-weight="${o.w || 700}" ${st} ${o.cls ? `class="${o.cls}"` : ''} ${o.ls ? `letter-spacing="${o.ls}"` : ''} ${o.filter ? `filter="${o.filter}"` : ''}>${s}</text>`;
}


// 굽은 띠(머리 타래·짚 술·찢긴 소매): 3차 곡선을 따라 굵기가 줄어드는 닫힌 모양
function bz(p, t) { const u = 1 - t; return [0, 1].map((k) => u * u * u * p[0][k] + 3 * u * u * t * p[1][k] + 3 * u * t * t * p[2][k] + t * t * t * p[3][k]); }
function taper(p, w0, w1 = 0, n = 22) {
  const A = [], B = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n, a = bz(p, t), b = bz(p, Math.min(1, t + 0.01)), c = bz(p, Math.max(0, t - 0.01));
    let dx = b[0] - c[0], dy = b[1] - c[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const w = (w0 * Math.pow(1 - t, 0.7) + w1 * t) / 2;
    A.push([a[0] - dy * w, a[1] + dx * w]); B.push([a[0] + dy * w, a[1] - dx * w]);
  }
  const f = (q) => q[0].toFixed(1) + ',' + q[1].toFixed(1);
  return 'M' + A.map(f).join(' L') + ' L' + B.reverse().map(f).join(' L') + ' Z';
}
// 앞머리: 정수리 곡선 + 오른쪽→왼쪽으로 내려오는 타래들. roots n+1개(왼→오), tips n개
function bangs(roots, tips, top) {
  const n = tips.length, a = roots[0], b = roots[n], mx = (a[0] + b[0]) / 2;
  let d = `M${a[0]},${a[1]} C${a[0] - 3},${top + 10} ${a[0] + 10},${top} ${mx},${top} C${b[0] - 10},${top} ${b[0] + 3},${top + 10} ${b[0]},${b[1]} `;
  for (let i = n - 1; i >= 0; i--) {
    const R = roots[i + 1], Lp = roots[i], t = tips[i];
    d += `C${R[0]},${R[1] + (t[1] - R[1]) * 0.5} ${t[0] + (R[0] - t[0]) * 0.3},${t[1] - (t[1] - R[1]) * 0.22} ${t[0]},${t[1]} `;
    d += `C${t[0] + (Lp[0] - t[0]) * 0.45},${t[1] - (t[1] - Lp[1]) * 0.35} ${Lp[0]},${Lp[1] + (t[1] - Lp[1]) * 0.4} ${Lp[0]},${Lp[1]} `;
  }
  return d + 'Z';
}
// 주먹: 가로로 무언가를 쥔 손 (x,y 중심)
function fist(x, y, m, o = {}) {
  const k = o.k || 1, d = `M${x - 8 * k},${y - 6 * k} C${x - 6 * k},${y - 10 * k} ${x + 6 * k},${y - 10 * k} ${x + 8 * k},${y - 6 * k} L${x + 8.5 * k},${y + 5 * k} C${x + 6 * k},${y + 9 * k} ${x - 6 * k},${y + 9 * k} ${x - 8 * k},${y + 5 * k} Z`;
  return P(d, m, { sw: 1.2, inner: L(`M${x - 7 * k},${y - 2 * k} H${x + 8 * k} M${x - 7 * k},${y + 2 * k} H${x + 8 * k} M${x - 7 * k},${y + 5.5 * k} H${x + 7 * k}`, '#d08e7e', 0.8) }) +
    P(`M${x - 9 * k},${y - 4 * k} C${x - 4 * k},${y - 8 * k} ${x + 2 * k},${y - 6 * k} ${x + 4 * k},${y - 2 * k} C${x},${y} ${x - 6 * k},${y} ${x - 9 * k},${y - 1 * k} Z`, m, { sw: 1 });
}

const SKIN = { b: '#fde6d6', s: '#f2b9a6', r: '#e3f7ff', l: '#a3604f' };
const SKIN_GHOST = { b: '#eaf3ff', s: '#b4c6e6', r: '#ffffff', l: '#5a6c9a' };

// ── 눈 ───────────────────────────────────────────────────────
// x,y 중심 · w,h 크기 · iris [어두운,밝은] · o.fem 속눈썹 · o.sad 처진 눈 · o.glow 빛나는 눈
function eye(x, y, w, h, iris, o = {}) {
  const g = id('g'), c = id('c');
  const tilt = o.sad ? 0.18 : (o.sharp ? -0.12 : 0);
  const scl = `M${x - w * 0.52},${y - h * (0.08 - tilt)} Q${x - w * 0.1},${y - h * 0.62} ${x + w * 0.52},${y - h * (0.32 + tilt)} L${x + w * 0.46},${y + h * 0.3} Q${x},${y + h * 0.56} ${x - w * 0.46},${y + h * 0.3} Z`;
  const ix = x + w * 0.1, iy = y + h * 0.06;
  let s = `<defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${iris[0]}"/><stop offset="0.55" stop-color="${iris[1]}"/><stop offset="1" stop-color="${iris[2] || iris[1]}"/></linearGradient><clipPath id="${c}"><path d="${scl}"/></clipPath></defs>`;
  s += `<path d="${scl}" fill="${o.glow ? '#dffbff' : '#f6f8ff'}"/>`;
  s += `<g clip-path="url(#${c})">`;
  s += `<path d="${scl}" fill="#c9d3f2" transform="translate(0,${-h * 0.62})" opacity="0.7"/>`;
  s += `<ellipse cx="${ix}" cy="${iy}" rx="${w * 0.36}" ry="${h * 0.5}" fill="url(#${g})" stroke="${iris[0]}" stroke-width="0.8"/>`;
  s += `<ellipse cx="${ix}" cy="${iy - h * 0.06}" rx="${w * 0.15}" ry="${h * 0.24}" fill="${o.glow ? '#ffffff' : iris[0]}" opacity="${o.glow ? 0.9 : 0.85}"/>`;
  s += `<ellipse cx="${ix}" cy="${iy + h * 0.3}" rx="${w * 0.26}" ry="${h * 0.14}" fill="#fff" opacity="0.28"/>`;
  s += `<circle cx="${ix - w * 0.13}" cy="${iy - h * 0.2}" r="${w * 0.12}" fill="#fff"/>`;
  s += `<circle cx="${ix + w * 0.14}" cy="${iy + h * 0.2}" r="${w * 0.055}" fill="#fff" opacity="0.9"/>`;
  s += `</g>`;
  const lash = o.lash || '#2a1a2a';
  // 윗눈꺼풀 선 (굵은 초승달)
  s += `<path d="M${x - w * 0.6},${y + h * (0.02 + tilt)} Q${x - w * 0.12},${y - h * 0.74} ${x + w * 0.58},${y - h * (0.36 + tilt)} ${o.fem ? `L${x + w * 0.74},${y - h * (0.5 + tilt)} L${x + w * 0.6},${y - h * (0.26 + tilt)}` : `L${x + w * 0.6},${y - h * (0.26 + tilt)}`} Q${x - w * 0.12},${y - h * 0.56} ${x - w * 0.52},${y + h * (0.06 + tilt)} Z" fill="${lash}"/>`;
  if (o.fem) s += `<path d="M${x - w * 0.5},${y - h * 0.02} l${-w * 0.16},${-h * 0.08} l${w * 0.08},${h * 0.14} Z" fill="${lash}"/>`;
  s += L(`M${x - w * 0.12},${y + h * 0.5} Q${x + w * 0.22},${y + h * 0.46} ${x + w * 0.44},${y + h * 0.3}`, lash, 0.9, 'opacity="0.6"');
  if (o.lid) s += L(`M${x - w * 0.4},${y - h * 0.56} Q${x},${y - h * 0.82} ${x + w * 0.42},${y - h * 0.62}`, lash, 0.7, 'opacity="0.45"');
  return s;
}
const blush = (x, y, r = 6) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 0.55}" fill="#ff8f9a" opacity="0.45" filter="url(#soft2)"/>`;

// ── 승려 ─────────────────────────────────────────────────────
function monk() {
  KEY = [-5, -4]; RIM = [-2.6, 0];
  const ROBE = { b: '#9aa3be', s: '#6a7393', r: '#c8f0ff', l: '#3c4260' };
  const KASA = { b: '#a8693c', s: '#743f1f', r: '#ffd9a8', l: '#4a2410' };
  const GOLD = { b: '#f6cf6a', s: '#b9852a', r: '#fff6cf', l: '#6a4510' };
  let s = '';
  // 육환장 지팡이 (뒤)
  s += P(RR(58, -352, 7, 352, 3), { b: '#8a5a2e', s: '#5a3518', r: '#ffd9a8', l: '#3a200c' });
  s += `<g filter="url(#glowGold)">`;
  const loop = 'M61.5,-354 C42,-362 38,-388 50,-402 C55,-407 59,-409 61.5,-416 C64,-409 68,-407 73,-402 C85,-388 81,-362 61.5,-354 Z';
  s += `<path d="${loop}" fill="none" stroke="#6a4510" stroke-width="7"/><path d="${loop}" fill="none" stroke="#f6cf6a" stroke-width="4"/><path d="${loop}" fill="none" stroke="#fff6cf" stroke-width="1.2" transform="translate(-1,-1)"/>`;
  s += P('M61.5,-364 C56,-370 56,-380 61.5,-390 C67,-380 67,-370 61.5,-364 Z', GOLD, { sw: 1.2 });
  s += P('M58,-416 L61.5,-430 L65,-416 Z', GOLD, { sw: 1.2 });
  [[46, -394], [42, -380], [47, -366], [77, -394], [81, -380], [76, -366]].forEach(([x, y]) => {
    s += `<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="#6a4510" stroke-width="4.6"/><circle cx="${x}" cy="${y}" r="7" fill="none" stroke="#f6cf6a" stroke-width="2.6"/><path d="M${x - 5},${y - 4} A7,7 0 0 1 ${x + 2},${y - 7}" fill="none" stroke="#fff6cf" stroke-width="1.4"/>`;
  });
  s += `</g>`;
  // 신
  s += P('M-32,-8 C-32,-14 -12,-15 -9,-8 L-8,0 L-34,0 Z', { b: '#4a5068', s: '#2c3044', r: '#9fd8ff', l: '#151826' });
  s += P('M8,-8 C9,-15 30,-14 31,-8 L33,0 L7,0 Z', { b: '#4a5068', s: '#2c3044', r: '#9fd8ff', l: '#151826' });
  // 장삼
  const robe = 'M-16,-248 C-32,-246 -46,-238 -50,-222 C-56,-186 -54,-120 -56,-62 C-58,-32 -60,-16 -58,-6 C-30,2 30,2 58,-6 C58,-32 54,-110 52,-180 C52,-222 46,-240 16,-248 Z';
  s += P(robe, ROBE, {
    inner: L('M-34,-80 C-36,-52 -38,-30 -40,-8 M6,-82 C8,-52 10,-28 12,-6 M34,-86 C38,-52 40,-26 44,-8', '#535b7c', 1.3, 'opacity="0.7"') +
      `<path d="M10,-84 C14,-52 18,-28 22,-6 L44,-8 C40,-30 38,-56 34,-86 Z" fill="#6a7393" opacity="0.55"/>`
  });
  // 가사 (조각보)
  const kasa = 'M-48,-232 C-32,-246 -10,-247 6,-240 L50,-150 C53,-120 52,-100 48,-86 L-52,-80 C-56,-122 -56,-190 -48,-232 Z';
  let pat = '';
  const pc = ['#b47442', '#94552c', '#a8693c', '#8a4c26', '#bd7e4b'];
  for (let i = 0; i < 7; i++) for (let j = 0; j < 8; j++) pat += `<rect x="${-60 + i * 17}" y="${-252 + j * 22}" width="17" height="22" fill="${pc[(i * 2 + j * 3) % 5]}"/>`;
  let grid = '';
  for (let i = 0; i <= 7; i++) grid += `M${-60 + i * 17},-256 V-70 `;
  for (let j = 0; j <= 8; j++) grid += `M-64,${-252 + j * 22} H64 `;
  s += P(kasa, KASA, {
    inner: `<g transform="rotate(-10 0 -160)">${pat}<path d="${grid}" stroke="#5c2c12" stroke-width="1.6" fill="none"/></g>` +
      `<path d="M10,-232 L50,-150 C53,-120 52,-100 48,-86 L22,-86 C30,-130 26,-190 10,-232 Z" fill="#4a2410" opacity="0.32"/>`
  });
  s += L('M6,-240 L50,-150', '#f6cf6a', 2.6) + L('M6,-240 L50,-150', '#6a4510', 0.8, 'opacity="0.6"');
  s += L('M-52,-80 L48,-86', '#f6cf6a', 2.4);
  s += `<circle cx="-26" cy="-214" r="6" fill="none" stroke="#6a4510" stroke-width="4"/><circle cx="-26" cy="-214" r="6" fill="none" stroke="#f6cf6a" stroke-width="2.4"/>`;
  // 깃 (교임)
  s += P('M-16,-248 L8,-206 L16,-212 L-4,-248 Z', { b: '#3c4260', s: '#262a40', r: '#9fd8ff', l: '#151826' }, { sw: 1 });
  s += P('M16,-248 L4,-222 L-2,-232 L6,-248 Z', { b: '#3c4260', s: '#262a40', r: '#9fd8ff', l: '#151826' }, { sw: 1 });
  // 목
  s += P('M-11,-262 L-11,-244 Q0,-238 12,-244 L12,-262 Z', SKIN, { sw: 1.2 });
  s += `<path d="M-11,-252 Q0,-246 12,-252 L12,-244 Q0,-238 -11,-244 Z" fill="#e0a08e" opacity="0.6"/>`;
  // 염주
  for (let i = 0; i <= 18; i++) {
    const a = Math.PI * (0.08 + 0.84 * i / 18), x = -24 * Math.cos(a), y = -236 + 34 * Math.sin(a);
    s += `<circle cx="${x}" cy="${y}" r="3.8" fill="#4a2a1e" stroke="#1e0e08" stroke-width="0.9"/><circle cx="${x - 1.2}" cy="${y - 1.2}" r="1.2" fill="#c08a6a"/>`;
  }
  s += `<circle cx="0" cy="-200" r="5" fill="#c4572e" stroke="#4a1a08" stroke-width="1"/>` + P('M-4,-196 L4,-196 L7,-176 L-7,-176 Z', { b: '#d8603a', s: '#9a3418', l: '#4a1a08' }, { sw: 1 });
  // 왼팔 (반합장) + 큰 소매
  const sl = 'M-40,-238 C-58,-226 -64,-196 -66,-160 C-68,-134 -64,-114 -52,-108 C-38,-104 -22,-114 -14,-132 C-10,-148 -8,-176 -8,-200 L-26,-210 C-30,-196 -34,-180 -38,-168 Z';
  s += P(sl, ROBE, { inner: L('M-58,-150 C-54,-130 -46,-118 -36,-114', '#535b7c', 1.2) });
  s += P('M-13,-206 C-15,-220 -12,-236 -6,-242 C-2,-245 2,-242 2,-236 L2,-210 C0,-202 -9,-199 -13,-206 Z', SKIN, {
    inner: L('M-2,-240 L-2,-214 M-6,-238 L-6,-214', '#d9988a', 0.9)
  });
  // 오른팔 (지팡이를 쥔다)
  s += P('M38,-242 C56,-232 66,-210 72,-182 C76,-162 76,-142 70,-130 C62,-122 48,-128 44,-142 C42,-162 42,-182 36,-202 Z', ROBE);
  s += fist(62.5, -182, SKIN, { k: 1 });
  // 머리
  s += P('M-24,-292 C-33,-294 -35,-280 -31,-273 C-29,-269 -25,-269 -23,-272 Z', SKIN, { sw: 1.3 });
  const head = 'M-26,-296 C-27,-318 -10,-328 2,-328 C19,-328 31,-317 30,-296 C30,-284 27,-271 22,-262 C17,-253 10,-249 6,-249 C0,-249 -10,-255 -16,-263 C-22,-271 -26,-284 -26,-296 Z';
  s += P(head, SKIN, {
    inner: `<path d="M-26,-300 C-24,-322 -6,-328 4,-328 C20,-328 30,-318 30,-300 C18,-312 -14,-314 -26,-300 Z" fill="#7d8cc0" opacity="0.28"/>` +
      `<path d="M30,-296 C30,-284 27,-271 22,-262 C17,-253 10,-249 6,-249 C14,-256 20,-270 22,-290 Z" fill="#f2b9a6"/>`
  });
  s += `<ellipse cx="-8" cy="-317" rx="9" ry="3.6" fill="#fff" opacity="0.75" transform="rotate(-22 -8 -317)"/>`;
  s += eye(-6, -284, 12, 9, ['#3a1a08', '#a8581c', '#f2b04a'], { sharp: true, lid: true });
  s += eye(15, -284, 9.5, 8.6, ['#3a1a08', '#a8581c', '#f2b04a'], { sharp: true });
  s += L('M-15,-296 Q-8,-300 0,-296', '#3a2418', 2.2) + L('M9,-296 Q15,-298 21,-294', '#3a2418', 2);
  s += L('M8,-278 L10,-270 L7,-269', '#c47e6c', 1.2);
  s += L('M3,-259 Q7,-257 11,-259.5', '#8a4040', 1.4);
  s += blush(-8, -273, 5) + blush(17, -273, 4);
  return s;
}

// ── 만신 ─────────────────────────────────────────────────────
function manshin() {
  KEY = [-5, -4]; RIM = [-2.6, 0];
  const RED = { b: '#e2353f', s: '#a01d33', r: '#ffd2c2', l: '#5a0c1c' };
  const BLUE = { b: '#2f66d4', s: '#1c3d8e', r: '#a8ecff', l: '#0e1e4a' };
  const HAIR = { b: '#2e2848', s: '#1a1530', r: '#8fb4ff', l: '#0c0a18' };
  const WHITE = { b: '#fbf6ec', s: '#d8d0c4', r: '#ffffff', l: '#7a6a5a' };
  const GOLD = { b: '#f6cf6a', s: '#b9852a', r: '#fff6cf', l: '#6a4510' };
  let s = '';
  // 뒷머리 + 긴 머리
  s += P(taper([[-18, -238], [-48, -200], [-30, -150], [-46, -96]], 26, 2), HAIR, { inner: L('M-28,-216 C-44,-186 -34,-150 -42,-110', '#5b6fae', 1.1, 'opacity="0.8"') });
  s += P(taper([[-10, -236], [-34, -196], [-20, -150], [-30, -110]], 16, 1), HAIR, { sw: 1.1 });
  s += P('M-27,-268 C-31,-294 -14,-308 4,-308 C23,-308 33,-294 31,-268 C31,-250 27,-238 23,-230 L-25,-228 C-31,-242 -29,-256 -27,-268 Z', HAIR);
  // 붉은 댕기
  s += P('M-30,-232 C-38,-222 -46,-200 -50,-176 L-42,-176 C-38,-198 -32,-216 -24,-226 Z', RED, { sw: 1 });
  s += P('M-26,-232 C-30,-220 -32,-196 -32,-172 L-25,-174 C-24,-196 -22,-216 -20,-228 Z', RED, { sw: 1 });
  // 버선
  s += P('M-28,-4 C-26,-11 -11,-11 -7,-7 C-3,-9 0,-5 -4,0 L-28,0 Z', WHITE, { sw: 1.2 });
  s += P('M8,-4 C10,-11 25,-11 29,-7 C33,-9 35,-5 31,0 L8,0 Z', WHITE, { sw: 1.2 });
  // 푸른 치마
  s += P('M-48,-98 C-54,-62 -58,-26 -60,-5 C-20,4 22,4 58,-5 C56,-30 50,-66 46,-98 Z', BLUE, {
    inner: L('M-30,-92 C-34,-60 -38,-30 -40,-4 M-6,-92 C-6,-60 -6,-30 -6,0 M20,-92 C22,-60 26,-30 30,-2', '#163476', 1.2, 'opacity="0.8"') +
